[pytest]
DJANGO_SETTINGS_MODULE = config.settings.dev
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    docs_consistency: doc-vs-code assertions (roles, districts, URLs, tier pricing)
    rbac: role-based access control matrix tests
    legacy_fixture: legacy site fixture consistency checks
    known_issue: DEBUGLOG regression canary tests
    write_path: public write-path / form-submission tests (no role gating)
    fsm: django-fsm transition-chain regression tests
