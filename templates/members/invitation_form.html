{% extends "base.html" %}

{% block title %}邀請新會員 — 技擊跆拳道會 CRM{% endblock %}

{% block content %}
<h1 class="h3 mb-4">邀請新會員 Invite New Member</h1>
<p class="text-muted">向家長/監護人電郵發送登記連結，由對方自行填寫子女資料。</p>
<form method="post" style="max-width: 500px;">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">發送邀請 Send Invitation</button>
</form>
{% endblock %}
